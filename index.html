<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Сонячна система</title>

<style>
/* ====== Загальні стилі ====== */

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle, #020024, #000814, #000);
    color: white;
    overflow: hidden;
}

/* Заголовок */

header {
    text-align: center;
    padding: 20px;
    font-size: 32px;
    letter-spacing: 2px;
    background: rgba(0,0,0,0.5);
    box-shadow: 0 0 20px #00ffff;
}

/* Контейнер системи */

#solar-system {
    position: relative;
    width: 100vw;
    height: calc(100vh - 80px);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Сонце */

#sun {
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, #fff700, #ff8800);
    border-radius: 50%;
    box-shadow: 0 0 50px #ffcc00;
    position: absolute;
    z-index: 10;
    animation: pulse 3s infinite alternate;
}

/* Орбіти */

.orbit {
    position: absolute;
    border: 1px dashed rgba(255,255,255,0.2);
    border-radius: 50%;
    animation: rotate linear infinite;
}

/* Планети */

.planet {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
}

.planet:hover {
    transform: scale(1.3);
    box-shadow: 0 0 20px white;
}

/* Анімація обертання */

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* Пульсація Сонця */

@keyframes pulse {
    from { box-shadow: 0 0 30px #ffcc00; }
    to { box-shadow: 0 0 70px #ffaa00; }
}

/* Панель інформації */

#info {
    position: fixed;
    right: 20px;
    top: 100px;
    width: 280px;
    background: rgba(0,0,0,0.7);
    border: 1px solid #00ffff;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 0 15px #00ffff;
    display: none;
}

#info h2 {
    margin-top: 0;
    color: #00ffff;
}

#close {
    float: right;
    cursor: pointer;
    color: red;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    🌌 Сонячна система
</header>

<div id="solar-system">

    <!-- Сонце -->
    <div id="sun"></div>

    <!-- Орбіти та планети -->

    <div class="orbit" style="width:200px;height:200px;animation-duration:6s;">
        <div class="planet" 
             data-name="Меркурій"
             data-info="Найближча до Сонця планета."
             style="width:15px;height:15px;background:#aaa;top:-7px;left:50%;">
        </div>
    </div>

    <div class="orbit" style="width:280px;height:280px;animation-duration:9s;">
        <div class="planet"
             data-name="Венера"
             data-info="Найгарячіша планета Сонячної системи."
             style="width:22px;height:22px;background:#ffd27f;top:-11px;left:50%;">
        </div>
    </div>

    <div class="orbit" style="width:360px;height:360px;animation-duration:12s;">
        <div class="planet"
             data-name="Земля"
             data-info="Єдина відома планета з життям."
             style="width:24px;height:24px;background:#00aaff;top:-12px;left:50%;">
        </div>
    </div>

    <div class="orbit" style="width:440px;height:440px;animation-duration:15s;">
        <div class="planet"
             data-name="Марс"
             data-info="Червона планета."
             style="width:20px;height:20px;background:#ff5533;top:-10px;left:50%;">
        </div>
    </div>

    <div class="orbit" style="width:560px;height:560px;animation-duration:20s;">
        <div class="planet"
             data-name="Юпітер"
             data-info="Найбільша планета."
             style="width:40px;height:40px;background:#ffbb88;top:-20px;left:50%;">
        </div>
    </div>

    <div class="orbit" style="width:680px;height:680px;animation-duration:25s;">
        <div class="planet"
             data-name="Сатурн"
             data-info="Має красиві кільця."
             style="width:36px;height:36px;background:#eecb8b;top:-18px;left:50%;">
        </div>
    </div>

    <div class="orbit" style="width:800px;height:800px;animation-duration:30s;">
        <div class="planet"
             data-name="Уран"
             data-info="Обертаться лежачи."
             style="width:28px;height:28px;background:#66ffff;top:-14px;left:50%;">
        </div>
    </div>

    <div class="orbit" style="width:920px;height:920px;animation-duration:35s;">
        <div class="planet"
             data-name="Нептун"
             data-info="Найвіддаленіша планета."
             style="width:26px;height:26px;background:#3366ff;top:-13px;left:50%;">
        </div>
    </div>

</div>

<!-- Інформаційне вікно -->

<div id="info">
    <span id="close">✖</span>
    <h2 id="planetName"></h2>
    <p id="planetInfo"></p>
</div>

<script>
// Отримуємо всі планети
const planets = document.querySelectorAll(".planet");
const infoBox = document.getElementById("info");
const planetName = document.getElementById("planetName");
const planetInfo = document.getElementById("planetInfo");
const closeBtn = document.getElementById("close");

// Клік по планеті
planets.forEach(planet => {
    planet.addEventListener("click", () => {

        const name = planet.dataset.name;
        const info = planet.dataset.info;

        planetName.textContent = name;
        planetInfo.textContent = info;

        infoBox.style.display = "block";
    });
});

// Закрити вікно
closeBtn.addEventListener("click", () => {
    infoBox.style.display = "none";
});

// Закриття кліком поза панеллю
window.addEventListener("click", (e) => {
    if(e.target === infoBox){
        infoBox.style.display = "none";
    }
});
</script>

</body>
</html>
